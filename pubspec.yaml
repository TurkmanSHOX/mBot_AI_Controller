name: mbot_ai_controller
description: "AI Voice-Controlled mBot Makeblock Android Controller"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  flutter_blue_plus: ^1.34.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  http: ^1.2.0
  flutter_dotenv: ^5.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
